<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Shoes Card</title>
  <style>
    :root {
      --bg-dark: #18181b;
      --bg-card: #232326;
      --gray-1: #2d2d31;
      --gray-2: #3a3a3e;
      --gray-3: #52525b;
      --gray-4: #a1a1aa;
      --white: #fff;
      --radius: 16px;
      --transition: 0.2s cubic-bezier(.4,0,.2,1);
      --font-main: 'Inter', system-ui, sans-serif;
    }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: var(--bg-dark);
      font-family: var(--font-main);
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: var(--bg-card);
      border-radius: var(--radius);
      box-shadow: 0 4px 24px 0 rgba(0,0,0,0.25);
      width: 90vw;
      max-width: 400px;
      padding: 2rem 1.5rem 1.5rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
    }
    .card-header {
      width: 100%;
      text-align: center;
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--white);
      margin-bottom: 0.5rem;
      letter-spacing: 0.01em;
    }
    .shoe-img {
      width: 100%;
      max-width: 220px;
      aspect-ratio: 1.7/1;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.5rem;
      perspective: 800px;
    }
    .shoe-img img {
      display: none;
    }
    #shoeImg {
      width: 100%;
      max-width: 220px;
      aspect-ratio: 1.7/1;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.5rem;
      perspective: 800px;
      border-radius: 12px;
      box-shadow: 0 2px 12px 0 rgba(0,0,0,0.18);
      transition: transform 0.8s cubic-bezier(.4,0,.2,1);
      will-change: transform;
    }
    .play-btn {
      margin: 0.5rem 0 0.7rem 0;
      width: 100%;
      max-width: 160px;
      background: var(--gray-2);
      color: var(--white);
      border: none;
      border-radius: 999px;
      padding: 0.7rem 0;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background var(--transition), box-shadow var(--transition);
      box-shadow: 0 1px 4px 0 rgba(0,0,0,0.10);
    }
    .play-btn:active {
      background: var(--gray-3);
    }
    .color-row {
      display: flex;
      gap: 0.7rem;
      justify-content: center;
      margin: 0.5rem 0 0.7rem 0;
    }
    .color-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--gray-1);
      border: 2px solid var(--gray-3);
      cursor: not-allowed;
      transition: box-shadow var(--transition);
      box-shadow: 0 1px 4px 0 rgba(0,0,0,0.10);
    }
    .color-btn:nth-child(2) { background: var(--gray-2); }
    .color-btn:nth-child(3) { background: var(--gray-3); }
    .color-btn:nth-child(4) { background: var(--gray-4); }
    .color-btn:nth-child(5) { background: var(--white); border-color: var(--gray-4); }
    .dropdown-row {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      margin-bottom: 0.7rem;
    }
    .dropdown-label {
      color: var(--gray-4);
      font-size: 0.95rem;
      margin-bottom: 0.2rem;
      font-weight: 500;
    }
    select, input[type="date"] {
      width: 100%;
      background: var(--gray-1);
      color: var(--white);
      border: none;
      border-radius: 10px;
      padding: 0.6rem 0.8rem;
      font-size: 1rem;
      margin-bottom: 0.1rem;
      outline: none;
      box-shadow: 0 1px 4px 0 rgba(0,0,0,0.10);
      transition: background var(--transition);
    }
    select:focus, input[type="date"]:focus {
      background: var(--gray-2);
    }
    .info-row {
      width: 100%;
      display: flex;
      gap: 0.7rem;
      justify-content: center;
      margin-bottom: 0.7rem;
    }
    .info-box {
      background: var(--gray-2);
      color: var(--white);
      border-radius: 999px;
      padding: 0.4rem 1.1rem;
      font-size: 0.95rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      box-shadow: 0 1px 4px 0 rgba(0,0,0,0.10);
    }
    .action-btn {
      width: 100%;
      background: var(--white);
      color: var(--bg-card);
      border: none;
      border-radius: 999px;
      padding: 0.9rem 0;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.5rem;
      box-shadow: 0 2px 8px 0 rgba(0,0,0,0.12);
      transition: background var(--transition), color var(--transition), box-shadow var(--transition);
    }
    .action-btn:hover, .action-btn:active {
      background: var(--gray-3);
      color: var(--white);
      box-shadow: 0 4px 16px 0 rgba(0,0,0,0.18);
    }
    @media (max-width: 480px) {
      .card {
        padding: 1.2rem 0.7rem 1rem 0.7rem;
        max-width: 98vw;
      }
      .shoe-img {
        max-width: 160px;
      }
    }
    @media (max-width: 360px) {
      .card-header { font-size: 1.1rem; }
      .action-btn { font-size: 1rem; }
    }
    /* Animation */
    @keyframes rotateY {
      0% { transform: rotateY(0deg); }
      100% { transform: rotateY(360deg); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">New Shoes</div>
    <div class="shoe-img">
      <div id="shoeImg">
        <svg xmlns="http://www.w3.org/2000/svg" version="1.0" width="100%" height="100%" viewBox="0 0 1280 640" preserveAspectRatio="xMidYMid meet">
          <g transform="translate(0,640) scale(0.1,-0.1)" fill="#fff" stroke="none">
            <path d="M4025 6153 c-66 -30 -170 -79 -230 -108 -312 -150 -342 -321 -111 -642 45 -62 66 -101 66 -121 0 -58 -31 -132 -79 -189 -26 -32 -54 -71 -62 -86 -14 -28 -44 -44 -339 -178 -79 -36 -92 -39 -177 -39 -164 0 -416 66 -665 175 -260 114 -297 152 -533 545 -133 222 -154 251 -215 282 -138 70 -526 -25 -750 -183 -102 -72 -225 -260 -395 -604 -179 -363 -281 -596 -299 -680 -48 -230 -66 -549 -74 -1330 -4 -363 -8 -645 -10 -627 -3 26 -8 32 -27 32 -28 0 -21 39 -81 -445 -31 -255 -43 -387 -39 -425 13 -111 56 -304 80 -355 50 -105 149 -173 310 -213 283 -71 1908 -331 2080 -333 28 -1 147 17 265 40 587 110 826 132 1071 96 136 -20 151 -25 59 -21 -41 2 -65 2 -52 -1 12 -2 20 -9 16 -14 -17 -29 90 -78 246 -113 102 -23 396 -65 575 -81 33 -3 69 -8 80 -10 11 -3 -7 9 -40 25 -74 38 -58 34 70 -18 365 -146 723 -224 1155 -251 455 -30 1395 -40 1765 -21 528 28 888 85 1659 261 552 126 1499 376 1721 455 271 97 580 308 657 451 39 72 70 250 71 403 0 202 -28 262 -235 510 -127 151 -188 204 -228 198 -25 -4 -27 -1 -44 66 -43 169 -131 292 -280 390 -123 80 -345 193 -417 212 -97 25 -393 14 -724 -26 -159 -20 -312 -33 -395 -33 -126 -2 -140 0 -210 27 -96 37 -186 88 -440 251 -113 72 -222 141 -242 154 -21 12 -38 29 -38 36 0 20 -40 45 -73 45 -17 0 -82 29 -156 69 -69 38 -283 153 -475 256 -192 103 -358 197 -368 211 -11 13 -35 26 -56 30 -41 7 -765 390 -771 408 -2 6 -19 26 -38 44 -29 30 -37 33 -70 28 -34 -5 -61 8 -272 122 -231 125 -235 128 -246 167 -14 52 -43 67 -111 59 -51 -6 -56 -4 -233 91 -166 89 -181 99 -181 124 0 15 -7 36 -15 47 -20 26 -19 34 5 34 32 0 70 44 70 81 0 48 -66 105 -191 167 -235 116 -397 121 -531 18 l-43 -34 -80 56 c-246 170 -421 344 -510 505 -20 37 -40 67 -43 66 -4 -1 -61 -26 -127 -56z m1150 -641 c44 -15 80 -31 80 -36 0 -10 -65 -34 -109 -40 -17 -3 -45 -8 -62 -11 -24 -5 -43 1 -92 30 -34 20 -62 40 -62 44 0 15 74 40 120 40 25 0 81 -12 125 -27z m-1167 -4779 c-10 -2 -28 -2 -40 0 -13 2 -5 4 17 4 22 1 32 -1 23 -4z m55 -10 c-7 -2 -19 -2 -25 0 -7 3 -2 5 12 5 14 0 19 -2 13 -5z m54 -9 c-3 -3 -12 -4 -19 -1           </g>
        </svg>
      </div>
    </div>
    <button class="play-btn" id="playBtn">Play</button>
    <div class="color-row">
      <div class="color-btn"></div>
      <div class="color-btn"></div>
      <div class="color-btn"></div>
      <div class="color-btn"></div>
      <div class="color-btn"></div>
    </div>
    <div class="dropdown-row">
      <div>
        <div class="dropdown-label">Shoe Brand</div>
        <select>
          <option>New Balances</option>
          <option>Nike</option>
          <option>Adidas</option>
          <option>Puma</option>
        </select>
      </div>
      <div>
        <div class="dropdown-label">Commission Date</div>
        <input type="date" />
      </div>
    </div>
    <div class="info-row">
      <div class="info-box">Distance Tracked: <span>0mi</span></div>
      <div class="info-box">Time Tracked: <span>0hr</span></div>
    </div>
    <button class="action-btn">Create Shoes</button>
  </div>
  <script>
    const playBtn = document.getElementById('playBtn');
    const shoeImg = document.getElementById('shoeImg');
    playBtn.addEventListener('click', () => {
      shoeImg.style.animation = 'rotateY 1.1s cubic-bezier(.4,0,.2,1)';
      shoeImg.addEventListener('animationend', () => {
        shoeImg.style.animation = '';
      }, { once: true });
    });
  </script>
</body>
</html>
