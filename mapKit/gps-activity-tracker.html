<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GPS Activity Trackr</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --panel: #181818;
      --white: #fff;
      --gray: #444;
      --neon: #39ff14;
      --neon-shadow: 0 0 8px #39ff14, 0 0 16px #39ff14;
      --font: 'Inter', 'Segoe UI', Arial, sans-serif;
    }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--white);
      font-family: var(--font);
      min-height: 100vh;
    }
    /* Grid layout for the container */
    .container {
      display: grid;
      grid-template-rows: auto auto auto 1fr auto;
      gap: 16px;
      max-width: 420px;
      margin: 0 auto;
      padding: 16px;
      min-height: 100vh;
      background: var(--bg);
    }

    .map-section {
      position: relative;
      width: 100%;
      height: 60vh; /* Fill most of the screen */
      background: url('path/to/san-francisco-map.jpg') center/cover no-repeat;
      border-radius: 16px;
      overflow: hidden;
    }
    .map-svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    /* Animated green path */
    #greenPath {
      stroke-dasharray: 500; /* Adjust based on path length */
      stroke-dashoffset: 500;
      animation: draw 5s linear forwards;
    }

    @keyframes draw {
      to {
        stroke-dashoffset: 0;
      }
    }
    /* Blinking marker */
    .blinking-marker {
      animation: blink 1.1s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    /* Play button styling */
    .play-btn {
      justify-self: center;
      background: var(--panel);
      color: var(--white);
      border: none;
      border-radius: 22px;
      padding: 10px 20px;
      font-size: 1rem;
      cursor: pointer;
    }
    /* Filters styling */
    .filters {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .filter-btn {
      background: var(--panel);
      color: var(--white);
      border: none;
      border-radius: 22px;
      padding: 10px 20px;
      font-size: 1rem;
      cursor: pointer;
    }
    /* Graph section styling */
    .graph-section {
      padding: 16px;
      background: var(--bg);
    }

    .graph-svg {
      width: 100%;
      height: 80px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="map-section">
      <svg class="map-svg" id="mapSVG" viewBox="0 0 400 480" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Simulated dark map background with streets -->
        <rect x="0" y="0" width="400" height="480" fill="#181c20" />
        <!-- Simple street grid for effect -->
        <g stroke="#23272b" stroke-width="2">
          <line x1="40" y1="0" x2="40" y2="480" />
          <line x1="120" y1="0" x2="120" y2="480" />
          <line x1="200" y1="0" x2="200" y2="480" />
          <line x1="280" y1="0" x2="280" y2="480" />
          <line x1="360" y1="0" x2="360" y2="480" />
          <line x1="0" y1="60" x2="400" y2="60" />
          <line x1="0" y1="160" x2="400" y2="160" />
          <line x1="0" y1="260" x2="400" y2="260" />
          <line x1="0" y1="360" x2="400" y2="360" />
          <line x1="0" y1="440" x2="400" y2="440" />
        </g>
        <!-- White GPS route path (example, stylized) -->
        <path id="routePath" d="M60,420 Q120,320 180,380 Q240,440 320,200 Q340,120 380,80" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        <!-- Neon green animated path -->
        <path id="greenPath" d="M60,420 Q120,320 180,380 Q240,440 320,200 Q340,120 380,80" stroke="#39ff14" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        <!-- Blinking marker (initially hidden, JS will move it) -->
        <circle id="greenMarker" class="blinking-marker" r="10" fill="#39ff14" stroke="#fff" stroke-width="2" cx="60" cy="420" style="opacity:0;" />
      </svg>
    </div>
    <button class="play-btn" id="playBtn">Play</button>
    <div class="filters">
      <button class="filter-btn">Walk</button>
      <button class="filter-btn">2023</button>
      <button class="filter-btn">This Month</button>
    </div>
    <div class="graph-section">
      <svg class="graph-svg" id="graphSVG" viewBox="0 0 400 80" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Dotted reference line -->
        <path id="graphRef" d="M20,60 Q80,40 160,50 Q240,60 320,30 Q380,20 380,20" stroke="#444" stroke-width="3" fill="none" stroke-dasharray="4 8" />
        <!-- Animated green progress line -->
        <path id="graphLine" d="M20,60 Q80,40 160,50 Q240,60 320,30 Q380,20 380,20" stroke="#39ff14" stroke-width="4" fill="none" stroke-linecap="round" />
      </svg>
    </div>
  </div>
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyANIPGHeQDBpjFhelcai1v4lTDERTDCkSI"></script>
  <script>
    let map, polyline, marker;
    const routeCoordinates = [
      { lat: 37.7749, lng: -122.4194 }, // Example coordinates
      { lat: 37.7799, lng: -122.4144 },
      { lat: 37.7849, lng: -122.4094 },
      { lat: 37.7899, lng: -122.4044 },
    ];

    function initMap() {
      map = new google.maps.Map(document.getElementById('map'), {
        center: { lat: 37.7749, lng: -122.4194 },
        zoom: 14,
        disableDefaultUI: true,
        styles: [
          { elementType: 'geometry', stylers: [{ color: '#212121' }] },
          { elementType: 'labels.icon', stylers: [{ visibility: 'off' }] },
          { elementType: 'labels.text.fill', stylers: [{ color: '#757575' }] },
          { elementType: 'labels.text.stroke', stylers: [{ color: '#212121' }] },
          { featureType: 'administrative', elementType: 'geometry', stylers: [{ color: '#757575' }] },
          { featureType: 'administrative.country', elementType: 'labels.text.fill', stylers: [{ color: '#9e9e9e' }] },
          { featureType: 'administrative.land_parcel', stylers: [{ visibility: 'off' }] },
          { featureType: 'administrative.locality', elementType: 'labels.text.fill', stylers: [{ color: '#bdbdbd' }] },
          { featureType: 'poi', elementType: 'labels.text.fill', stylers: [{ color: '#757575' }] },
          { featureType: 'poi.park', elementType: 'geometry', stylers: [{ color: '#181818' }] },
          { featureType: 'poi.park', elementType: 'labels.text.fill', stylers: [{ color: '#616161' }] },
          { featureType: 'poi.park', elementType: 'labels.text.stroke', stylers: [{ color: '#1b1b1b' }] },
          { featureType: 'road', elementType: 'geometry.fill', stylers: [{ color: '#2c2c2c' }] },
          { featureType: 'road', elementType: 'labels.text.fill', stylers: [{ color: '#8a8a8a' }] },
          { featureType: 'road.arterial', elementType: 'geometry', stylers: [{ color: '#373737' }] },
          { featureType: 'road.highway', elementType: 'geometry', stylers: [{ color: '#3c3c3c' }] },
          { featureType: 'road.highway.controlled_access', elementType: 'geometry', stylers: [{ color: '#4e4e4e' }] },
          { featureType: 'road.local', elementType: 'labels.text.fill', stylers: [{ color: '#616161' }] },
          { featureType: 'transit', elementType: 'labels.text.fill', stylers: [{ color: '#757575' }] },
          { featureType: 'water', elementType: 'geometry', stylers: [{ color: '#000000' }] },
          { featureType: 'water', elementType: 'labels.text.fill', stylers: [{ color: '#3d3d3d' }] },
        ],
      });

      polyline = new google.maps.Polyline({
        path: [],
        geodesic: true,
        strokeColor: '#39ff14',
        strokeOpacity: 1.0,
        strokeWeight: 4,
        map: map,
      });

      marker = new google.maps.Marker({
        position: routeCoordinates[0],
        map: map,
        icon: {
          path: google.maps.SymbolPath.CIRCLE,
          scale: 8,
          fillColor: '#39ff14',
          fillOpacity: 1,
          strokeColor: '#fff',
          strokeWeight: 2,
        },
      });

      animateRoute();
    }

    function animateRoute() {
      const greenPath = document.getElementById('greenPath');
      const greenMarker = document.getElementById('greenMarker');

      // Reset animation
      greenPath.style.animation = 'none';
      greenMarker.style.opacity = '0';

      setTimeout(() => {
        greenPath.style.animation = '';
        greenMarker.style.opacity = '1';
      }, 10);
    }

    document.getElementById('playBtn').addEventListener('click', animateRoute);

    window.addEventListener('DOMContentLoaded', initMap);
  </script>
  <div id="map" style="width: 100%; height: 400px; border-radius: 32px; overflow: hidden;"></div>
</body>
</html>
