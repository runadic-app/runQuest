<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Map Visualization</title>
    <style>
        body {
            margin: 0;
            background-color: black;
            font-family: 'Courier New', Courier, monospace;
        }

        #map {
            width: 100vw;
            height: 100vh;
        }

        .leaflet-container {
            background: black;
        }

        .glowing-line {
            stroke: cyan;
            stroke-width: 4;
            stroke-opacity: 0.8;
            stroke-linejoin: round;
            stroke-linecap: round;
            filter: drop-shadow(0 0 6px cyan);
        }
    </style>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin="anonymous"
    />
</head>
<body>
    <div id="map"></div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin="anonymous"
    ></script>
    <script>
        const map = L.map('map', {
            zoomControl: false,
            attributionControl: false
        }).setView([37.7749, -122.4194], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            minZoom: 10,
            noWrap: true
        }).addTo(map);

        const coordinates = [
            [37.7749, -122.4194],
            [37.7849, -122.4094],
            [37.7949, -122.3994],
            [37.8049, -122.3894]
        ];

        const polyline = L.polyline([], {
            className: 'glowing-line'
        }).addTo(map);

        let progress = 0;
        const duration = 2000; // Animation duration in milliseconds
        const easing = t => t * (2 - t); // easeOutQuad

        function animatePolyline(timestamp) {
            if (!start) start = timestamp;
            const elapsed = timestamp - start;
            progress = Math.min(elapsed / duration, 1);

            const easedProgress = easing(progress);
            const numPoints = Math.floor(easedProgress * coordinates.length);
            polyline.setLatLngs(coordinates.slice(0, numPoints));

            if (progress < 1) {
                requestAnimationFrame(animatePolyline);
            }
        }

        let start;
        map.on('load', () => {
            requestAnimationFrame(animatePolyline);
        });

        map.on('moveend', () => {
            start = null;
            progress = 0;
            polyline.setLatLngs([]);
            requestAnimationFrame(animatePolyline);
        });
    </script>
</body>
</html>
