<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>No Location View - Web Version</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: #191919;
      font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
    }
    .no-location-view {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #191919;
      overflow: hidden;
    }
    .dot-bg {
      position: absolute;
      width: 100%;
      height: 100%;
      background-image: url('dot_bg.png'); /* Replace with your image path */
      background-repeat: repeat;
      opacity: 0.1;
      z-index: 1;
      /* Gradient masks (approximate) */
      mask-image: linear-gradient(to bottom, transparent 0%, black 20%, black 70%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 20%, black 70%, transparent 100%);
    }
    .no-location-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .no-location-header {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
      pointer-events: auto;
    }
    .icon-warning {
      font-size: 2rem;
      color: #FFD600; /* adYellow */
      margin-right: 10px;
    }
    .no-location-title {
      color: #fff;
      font-size: 1.2rem;
      font-weight: 500;
    }
    .no-location-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 1rem;
      text-align: center;
      padding: 20px 30px;
      cursor: pointer;
      pointer-events: auto;
      max-width: 400px;
      line-height: 1.5;
      box-shadow: 0 0 8px #000;
      border-radius: 8px;
      transition: background 0.2s;
    }
    .no-location-btn:hover {
      background: rgba(255,255,255,0.05);
    }
    @media (max-width: 600px) {
      .no-location-btn {
        max-width: 90vw;
        font-size: 0.95rem;
        padding: 16px 10px;
      }
    }
  </style>
</head>
<body>
  <div class="no-location-view">
    <div class="dot-bg"></div>
    <div class="no-location-overlay">
      <div class="no-location-header">
        <span class="icon-warning">&#9888;</span>
        <span class="no-location-title">Location Permissions Needed</span>
      </div>
      <button class="no-location-btn" onclick="openSettings()">
        We need temporary permission to use your location to record your activity. Location data is never shared with anyone else.<br><br>
        Tap here to open Settings. Tap "Location," then tap "While Using the App."
      </button>
    </div>
  </div>
  <script>
    function openSettings() {
      // On web, you can't open device settings directly.
      // You can show a message or redirect to a help page.
      alert("Please enable location permissions in your browser or device settings.");
    }
  </script>
</body>
</html>
